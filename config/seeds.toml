# Part B1 seeds (spec 3.1). live = true since 2026-11-05 (Austin go-live); false keeps every push a dry run.
live = true
# dnc_check = false skips the FTC Do Not Call scrub (user decision 2026-11-05: B2B calls).
# Set it to true and save area-code files in state/dnc/ to scrub again.
dnc_check = false
scraper_depth = 5
max_enrich_per_city = 150
seen_days = 30

[niches."Counselors / therapists"]
money_query = "therapist in {city}"
money_keyword = "therapist {city_name}"
queries = ["counseling in {area}", "couples counseling {city}", "psychologist in {city}"]

[niches."Roofing"]
money_query = "roofer in {city}"
money_keyword = "roofer {city_name}"
queries = ["roofing contractor in {area}", "roof repair {city}", "roof replacement {city}"]

[niches."Personal injury lawyers"]
money_query = "personal injury lawyer in {city}"
money_keyword = "personal injury lawyer {city_name}"
queries = ["personal injury attorney in {area}", "car accident lawyer {city}"]

[niches."Med spas / dental"]
money_query = "med spa in {city}"
money_keyword = "med spa {city_name}"
queries = ["med spa in {area}", "dentist in {area}", "cosmetic dentist {city}"]

